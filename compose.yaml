x-app: &app
  build: .
  image: market:local
  environment:
    DATABASE_URL: postgres://market:market@postgres:5432/market?sslmode=disable
    HTTP_ADDR: ":8080"
  depends_on: &depends-postgres
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    entrypoint: ["/migrate"]
    restart: "no"

  api:
    <<: *app
    ports:
      - "8080:8080"
    depends_on:
      <<: *depends-postgres
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
