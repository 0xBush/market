basePath: /
definitions:
  auth.credentialsRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  httputil.ErrorBody:
    properties:
      error:
        type: string
    type: object
  order.CreateOrderRequest:
    properties:
      name:
        type: string
      quantity:
        type: integer
    type: object
  order.Order:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      quantity:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  order.OrderList:
    properties:
      items:
        items:
          $ref: '#/definitions/order.Order'
        type: array
    type: object
  server.HealthBody:
    properties:
      status:
        type: string
    type: object
  user.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
    type: object
info:
  contact: {}
  description: Marketplace REST API. Access JWT and refresh token are HttpOnly cookies.
  title: Market API
  version: "1.0"
paths:
  /healthz:
    get:
      description: Process is up
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.HealthBody'
      summary: Liveness
      tags:
      - ops
  /login:
    post:
      consumes:
      - application/json
      description: Set access/refresh cookies
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.credentialsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
      summary: Login
      tags:
      - auth
  /logout:
    post:
      description: Revoke refresh token and clear cookies
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
      summary: Logout
      tags:
      - auth
  /me:
    get:
      description: Return the account for the access cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
      summary: Current user
      tags:
      - auth
  /orders:
    get:
      description: List orders belonging to the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.OrderList'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
      summary: List orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Create a new order for the current user
      parameters:
      - description: Order to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/order.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: /orders/{id}
              type: string
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
      summary: Create order
      tags:
      - orders
  /orders/{id}:
    get:
      description: Get an order by ID belonging to the current user
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
      summary: Get order
      tags:
      - orders
  /readyz:
    get:
      description: DB answers ping
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.HealthBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
      summary: Readiness
      tags:
      - ops
  /refresh:
    post:
      description: Rotate refresh cookie and set a new access cookie
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
      summary: Refresh
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Create an account and set access/refresh cookies
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.credentialsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.ErrorBody'
      summary: Register
      tags:
      - auth
swagger: "2.0"
